<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Path to the Door</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a40;
    color: #fff;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
    height: 100%;
  }
  #wrap {
    display: flex;
    height: 100vh;
    align-items: stretch;
  }
  #stage {
    flex: 1;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #0a0a40;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  #panel {
    width: 240px;
    background: #11113b;
    border-left: 2px solid #1d1d6b;
    padding: 18px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 {
    margin: 0 0 4px 0;
    font-size: 18px;
    letter-spacing: 0.5px;
  }
  p.hint {
    margin: 0;
    font-size: 12px;
    line-height: 1.45;
    color: #aab;
  }
  .stat {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 6px 10px;
    background: #1a1a55;
    border-radius: 4px;
  }
  .stat b { color: #ffd24a; }
  .tools {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  button {
    font: inherit;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 4px;
    border: 2px solid #2a2a7a;
    background: #1a1a55;
    color: #fff;
    cursor: pointer;
    text-align: left;
  }
  button.active {
    background: #ffd24a;
    color: #1a1a55;
    border-color: #ffd24a;
  }
  button:hover:not(.active) {
    background: #22226a;
  }
  .row { display: flex; gap: 6px; }
  .row button { flex: 1; text-align: center; }
  #toast {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="560" height="780"></canvas>
    <div id="toast"></div>
  </div>
  <div id="panel">
    <h1>Path to the Door</h1>
    <p class="hint">
      Characters spawn at the bottom and walk up to the door.
      Place signs to nudge them left or right around obstacles.
    </p>
    <div class="stat"><span>Saved</span><b id="saved">0</b></div>
    <div class="stat"><span>Lost</span><b id="lost">0</b></div>
    <div class="stat"><span>Signs left</span><b id="signs">8</b></div>

    <div class="tools">
      <div style="font-size:12px;color:#aab;">Tool — click the path to place</div>
      <button id="tool-left" data-tool="left">◀ Go Left sign</button>
      <button id="tool-right" data-tool="right">Go Right sign ▶</button>
      <button id="tool-erase" data-tool="erase">✕ Remove sign</button>
    </div>
    <div class="row">
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
    </div>
    <p class="hint">
      Keys: <b>1</b> left, <b>2</b> right, <b>3</b> erase, <b>Space</b> pause.
    </p>
  </div>
</div>

<script>
"use strict";

const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = cvs.width;
const H = cvs.height;

// Path geometry — top-down view of a stone-bordered platform.
const PATH = {
  // The walkable path is a trapezoid that narrows toward the top
  // to give the illusion of perspective like in the reference art.
  topY: 70,
  bottomY: H - 90,
  topHalfWidth: 130,
  bottomHalfWidth: 200,
  centerX: W / 2,
};

function pathLeft(y) {
  const t = (y - PATH.topY) / (PATH.bottomY - PATH.topY);
  const hw = PATH.topHalfWidth + (PATH.bottomHalfWidth - PATH.topHalfWidth) * t;
  return PATH.centerX - hw;
}
function pathRight(y) {
  const t = (y - PATH.topY) / (PATH.bottomY - PATH.topY);
  const hw = PATH.topHalfWidth + (PATH.bottomHalfWidth - PATH.topHalfWidth) * t;
  return PATH.centerX + hw;
}
function onPath(x, y) {
  if (y < PATH.topY + 4 || y > PATH.bottomY - 4) return false;
  return x > pathLeft(y) + 8 && x < pathRight(y) - 8;
}

const DOOR = { x: PATH.centerX, y: PATH.topY + 8, w: 30, h: 36 };

// Obstacles — holes in the path that will lose a walker.
// Placed asymmetrically so the player has to route walkers around them.
const HOLES = [
  { x: PATH.centerX - 40, y: 250, r: 36 },
  { x: PATH.centerX + 70, y: 380, r: 30 },
  { x: PATH.centerX - 80, y: 500, r: 32 },
  { x: PATH.centerX + 40, y: 620, r: 28 },
];

function inHole(x, y) {
  for (const h of HOLES) {
    const dx = x - h.x, dy = y - h.y;
    if (dx * dx + dy * dy < h.r * h.r) return h;
  }
  return null;
}

// Signs — placed by the player.
let signs = [];
let signsLeft = 8;
const SIGN_RADIUS = 22; // how close a walker must come to trigger
const SIGN_COOLDOWN = 30; // frames after triggering before walker can be re-triggered by the same sign

// Walkers.
let walkers = [];
let nextSpawn = 0;
const SPAWN_INTERVAL = 70;

let saved = 0, lost = 0;
let paused = false;
let tool = "left";
let frame = 0;

function setTool(t) {
  tool = t;
  for (const b of document.querySelectorAll("button[data-tool]")) {
    b.classList.toggle("active", b.dataset.tool === t);
  }
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.style.opacity = "0"), 1200);
}

function spawnWalker() {
  // Spawn along the bottom row of the path, like the first reference image.
  const y = PATH.bottomY - 16;
  const left = pathLeft(y) + 18;
  const right = pathRight(y) - 18;
  const x = left + Math.random() * (right - left);
  walkers.push({
    x, y,
    // dir: -1 = left, 0 = up, 1 = right
    dir: 0,
    sideTimer: 0,           // frames remaining moving sideways
    cooldown: new Map(),    // sign index -> remaining frames
    state: "walk",          // walk | saved | falling
    fallT: 0,
    hueShift: Math.floor(Math.random() * 30) - 15,
  });
}

function updateWalker(w) {
  if (w.state === "falling") {
    w.fallT++;
    if (w.fallT > 25) w.state = "dead";
    return;
  }
  if (w.state !== "walk") return;

  // Tick cooldowns.
  for (const [k, v] of w.cooldown) {
    if (v <= 1) w.cooldown.delete(k);
    else w.cooldown.set(k, v - 1);
  }

  // Check signs.
  for (let i = 0; i < signs.length; i++) {
    if (w.cooldown.has(i)) continue;
    const s = signs[i];
    const dx = w.x - s.x, dy = w.y - s.y;
    if (dx * dx + dy * dy < SIGN_RADIUS * SIGN_RADIUS) {
      w.dir = s.dir === "left" ? -1 : 1;
      w.sideTimer = 60;
      w.cooldown.set(i, SIGN_COOLDOWN);
    }
  }

  // Movement. Speed is small for a relaxed pace.
  const upSpeed = 0.9;
  const sideSpeed = 1.1;

  let nx = w.x, ny = w.y;
  if (w.sideTimer > 0) {
    nx += w.dir * sideSpeed;
    // Still drift upward a bit so they keep progressing.
    ny -= upSpeed * 0.35;
    w.sideTimer--;
  } else {
    ny -= upSpeed;
    w.dir = 0;
  }

  // Bounce off the path borders.
  const lb = pathLeft(ny) + 12;
  const rb = pathRight(ny) - 12;
  if (nx < lb) { nx = lb; if (w.sideTimer > 0) { w.dir = 1; } }
  if (nx > rb) { nx = rb; if (w.sideTimer > 0) { w.dir = -1; } }

  // Fall into a hole?
  if (inHole(nx, ny)) {
    w.state = "falling";
    w.x = nx; w.y = ny;
    lost++;
    updateStats();
    return;
  }

  w.x = nx;
  w.y = ny;

  // Reach the door.
  const ddx = w.x - DOOR.x, ddy = w.y - DOOR.y;
  if (Math.abs(ddx) < DOOR.w / 2 && ddy < 14) {
    w.state = "saved";
    saved++;
    updateStats();
  }
}

function updateStats() {
  document.getElementById("saved").textContent = saved;
  document.getElementById("lost").textContent = lost;
  document.getElementById("signs").textContent = signsLeft;
}

// --- Drawing ---

// Stone-border texture is drawn procedurally for the path.
function drawPath() {
  // Ground fill (brown / dirt).
  ctx.beginPath();
  ctx.moveTo(pathLeft(PATH.topY), PATH.topY);
  ctx.lineTo(pathRight(PATH.topY), PATH.topY);
  ctx.lineTo(pathRight(PATH.bottomY), PATH.bottomY);
  ctx.lineTo(pathLeft(PATH.bottomY), PATH.bottomY);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, PATH.topY, 0, PATH.bottomY);
  grad.addColorStop(0, "#8a3a14");
  grad.addColorStop(1, "#b04a1c");
  ctx.fillStyle = grad;
  ctx.fill();

  // Speckled texture.
  ctx.save();
  ctx.clip();
  for (let i = 0; i < 600; i++) {
    const y = PATH.topY + Math.random() * (PATH.bottomY - PATH.topY);
    const x = pathLeft(y) + Math.random() * (pathRight(y) - pathLeft(y));
    const v = 40 + Math.random() * 60;
    ctx.fillStyle = `rgba(${v + 30},${v},${v - 10},0.4)`;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.restore();

  // Stone border — chained circles down each side.
  const stoneR = 12;
  const drawBorder = (side) => {
    const step = 18;
    for (let y = PATH.topY; y <= PATH.bottomY + 4; y += step) {
      const x = side === "L" ? pathLeft(y) : pathRight(y);
      // Drop shadow.
      ctx.fillStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.arc(x + 2, y + 3, stoneR, 0, Math.PI * 2);
      ctx.fill();
      // Stone.
      const sg = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, stoneR);
      sg.addColorStop(0, "#f6c244");
      sg.addColorStop(1, "#b27418");
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.arc(x, y, stoneR, 0, Math.PI * 2);
      ctx.fill();
    }
  };
  drawBorder("L");
  drawBorder("R");

  // Bottom face — the cliff side, drawn as a column of vertical stone tiles
  // to mimic the look of the reference images.
  const baseTop = PATH.bottomY;
  const baseBottom = H - 8;
  const bl = pathLeft(PATH.bottomY) - 4;
  const br = pathRight(PATH.bottomY) + 4;
  ctx.fillStyle = "#5a2a10";
  ctx.fillRect(bl, baseTop, br - bl, baseBottom - baseTop);
  const cols = 26;
  const colW = (br - bl) / cols;
  for (let i = 0; i < cols; i++) {
    const x = bl + i * colW;
    const cg = ctx.createLinearGradient(x, 0, x + colW, 0);
    cg.addColorStop(0, "#7a3010");
    cg.addColorStop(0.5, "#c47018");
    cg.addColorStop(1, "#7a3010");
    ctx.fillStyle = cg;
    ctx.fillRect(x + 1, baseTop + 2, colW - 2, baseBottom - baseTop - 2);
  }
}

function drawDoor() {
  const { x, y, w, h } = DOOR;
  // Frame.
  ctx.fillStyle = "#c47a20";
  ctx.fillRect(x - w / 2 - 3, y - 6, w + 6, h + 8);
  ctx.fillStyle = "#7a3a10";
  ctx.fillRect(x - w / 2, y - 4, w, h + 4);
  // Open doorway interior.
  ctx.fillStyle = "#1a6a30";
  ctx.fillRect(x - w / 2 + 4, y, w - 8, h - 4);
  // Top decorative blocks.
  ctx.fillStyle = "#e0a040";
  ctx.fillRect(x - w / 2 - 4, y - 10, 8, 6);
  ctx.fillRect(x - 4, y - 12, 8, 6);
  ctx.fillRect(x + w / 2 - 4, y - 10, 8, 6);
}

function drawHole(h) {
  // Dark pit with a rim.
  const g = ctx.createRadialGradient(h.x, h.y, 2, h.x, h.y, h.r);
  g.addColorStop(0, "#000");
  g.addColorStop(0.7, "#1a0a04");
  g.addColorStop(1, "#5a2a10");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.6)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(h.x, h.y, h.r - 1, 0, Math.PI * 2);
  ctx.stroke();
}

function drawCharacter(x, y, scale, opts = {}) {
  // Tiny pixel-style character: green hair, blue body. Drawn with rects.
  const s = scale;
  const px = (dx, dy, w, h, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x + dx * s), Math.round(y + dy * s), Math.max(1, w * s), Math.max(1, h * s));
  };
  const skin = "#ffd9a0";
  const hair = opts.hair || "#4ad04a";
  const body = opts.body || "#3060d0";
  const shoe = "#ffffff";

  // Shadow.
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(x, y + 9 * s, 5 * s, 1.6 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hair top.
  px(-3, -9, 6, 2, hair);
  px(-4, -7, 8, 2, hair);
  // Face.
  px(-3, -5, 6, 3, skin);
  // Eyes.
  px(-2, -4, 1, 1, "#101030");
  px(1, -4, 1, 1, "#101030");
  // Body.
  px(-3, -2, 6, 5, body);
  // Arms.
  px(-4, -1, 1, 3, body);
  px(3, -1, 1, 3, body);
  // Shoes.
  px(-3, 3, 3, 2, shoe);
  px(0, 3, 3, 2, shoe);
}

function drawSign(s) {
  // The "tall" sign-holder character with a sign.
  const x = s.x, y = s.y;
  drawCharacter(x, y, 2.4, { hair: "#4ad04a", body: "#3060d0" });
  // Sign on a pole.
  const dir = s.dir === "left" ? -1 : 1;
  const px = x + dir * 18;
  const py = y - 30;
  ctx.strokeStyle = "#3a2010";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + dir * 8, y - 14);
  ctx.lineTo(px, py + 14);
  ctx.stroke();
  // Sign board.
  ctx.fillStyle = "#c4862a";
  ctx.fillRect(px - 16, py - 4, 32, 22);
  ctx.fillStyle = "#7a4a10";
  ctx.fillRect(px - 16, py - 4, 32, 2);
  ctx.fillRect(px - 16, py + 16, 32, 2);
  ctx.fillStyle = "#1a1a30";
  ctx.font = "bold 9px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("GO", px, py + 3);
  ctx.fillText(s.dir === "left" ? "LEFT" : "RIGHT", px, py + 12);
}

function drawWalker(w) {
  if (w.state === "dead") return;
  if (w.state === "falling") {
    const t = w.fallT / 25;
    const scale = 1.6 * (1 - t);
    ctx.globalAlpha = 1 - t;
    drawCharacter(w.x, w.y + t * 6, Math.max(0.2, scale));
    ctx.globalAlpha = 1;
    return;
  }
  if (w.state === "saved") return;
  drawCharacter(w.x, w.y, 1.6);
}

function drawPreview() {
  if (!mouse.inside || tool === "erase") return;
  const x = mouse.x, y = mouse.y;
  if (!onPath(x, y) || inHole(x, y)) return;
  ctx.globalAlpha = 0.5;
  drawSign({ x, y, dir: tool });
  ctx.globalAlpha = 1;
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawPath();
  for (const h of HOLES) drawHole(h);
  drawDoor();
  // Sort walkers/signs by y so closer ones draw on top.
  const items = [...walkers.filter(w => w.state !== "dead").map(w => ({ y: w.y, kind: "w", ref: w })),
                 ...signs.map(s => ({ y: s.y, kind: "s", ref: s }))];
  items.sort((a, b) => a.y - b.y);
  for (const it of items) {
    if (it.kind === "w") drawWalker(it.ref);
    else drawSign(it.ref);
  }
  drawPreview();
}

function step() {
  if (!paused) {
    frame++;
    nextSpawn--;
    if (nextSpawn <= 0) {
      spawnWalker();
      nextSpawn = SPAWN_INTERVAL;
    }
    for (const w of walkers) updateWalker(w);
    walkers = walkers.filter(w => w.state !== "saved" && w.state !== "dead");
  }
  render();
  requestAnimationFrame(step);
}

// --- Input ---

const mouse = { x: 0, y: 0, inside: false };

function canvasPos(ev) {
  const r = cvs.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) * (cvs.width / r.width),
    y: (ev.clientY - r.top) * (cvs.height / r.height),
  };
}

cvs.addEventListener("mousemove", (e) => {
  const p = canvasPos(e);
  mouse.x = p.x; mouse.y = p.y; mouse.inside = true;
});
cvs.addEventListener("mouseleave", () => { mouse.inside = false; });

cvs.addEventListener("click", (e) => {
  const { x, y } = canvasPos(e);
  if (tool === "erase") {
    for (let i = 0; i < signs.length; i++) {
      const s = signs[i];
      const dx = x - s.x, dy = y - s.y;
      if (dx * dx + dy * dy < 28 * 28) {
        signs.splice(i, 1);
        signsLeft++;
        updateStats();
        return;
      }
    }
    return;
  }
  if (!onPath(x, y)) { toast("Place signs on the path."); return; }
  if (inHole(x, y)) { toast("Can't place a sign on a hole."); return; }
  if (signsLeft <= 0) { toast("No signs left — remove one first."); return; }
  // Keep signs from overlapping.
  for (const s of signs) {
    if ((s.x - x) ** 2 + (s.y - y) ** 2 < 36 * 36) {
      toast("Too close to another sign.");
      return;
    }
  }
  signs.push({ x, y, dir: tool });
  signsLeft--;
  updateStats();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "1") setTool("left");
  else if (e.key === "2") setTool("right");
  else if (e.key === "3") setTool("erase");
  else if (e.key === " ") { paused = !paused; document.getElementById("pause").textContent = paused ? "Resume" : "Pause"; e.preventDefault(); }
});

for (const b of document.querySelectorAll("button[data-tool]")) {
  b.addEventListener("click", () => setTool(b.dataset.tool));
}
document.getElementById("pause").addEventListener("click", () => {
  paused = !paused;
  document.getElementById("pause").textContent = paused ? "Resume" : "Pause";
});
document.getElementById("reset").addEventListener("click", () => {
  walkers = [];
  signs = [];
  signsLeft = 8;
  saved = 0; lost = 0;
  nextSpawn = 0;
  updateStats();
});

setTool("left");
updateStats();
step();
</script>
</body>
</html>
